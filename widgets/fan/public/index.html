<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        --accent: #0E7C66;
        --accent-soft: rgba(14, 124, 102, 0.16);
        --line: rgba(127, 127, 127, 0.22);
      }

      .wrap {
        padding: 4px 6px 6px;
      }

      .head {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #9CA3AF;
        flex: none;
      }

      .dot.on {
        background: #10B981;
      }

      .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .main {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 2px 12px;
      }

      .fan {
        width: 72px;
        height: 72px;
        flex: none;
        color: var(--accent);
      }

      .fan .blades {
        transform-origin: 48px 48px;
        animation: spin var(--spin, 0s) linear infinite;
        animation-play-state: var(--play, paused);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .fan .blades {
          animation: none;
        }
      }

      .mode {
        font-size: 28px;
        font-weight: 700;
        line-height: 1.1;
      }

      .details {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        margin-top: 4px;
        opacity: 0.7;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }

      .buttons button {
        border: 1px solid var(--line);
        background: transparent;
        color: inherit;
        border-radius: 10px;
        padding: 8px 0;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .buttons button.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .buttons button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .message {
        min-height: 16px;
        margin-top: 4px;
        color: #DC2626;
      }

      .empty {
        padding: 24px 8px;
        text-align: center;
        opacity: 0.6;
      }
    </style>

    <script>
      // Homey calls onHomeyReady once the bridge is available; expose it as a promise for the module.
      window.homeyReady = new Promise((resolve) => {
        window.onHomeyReady = resolve;
      });
    </script>
    <script type="module" src="widget.js"></script>
  </head>

  <body class="homey-widget">
    <div class="wrap" id="content">
      <div class="head">
        <span class="dot" id="dot"></span>
        <span class="name homey-text-medium" id="name"></span>
      </div>

      <div class="main">
        <svg class="fan" viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="48" cy="48" r="42" stroke-width="4" opacity="0.35" />
          <g class="blades">
            <path d="M48 42c-4-12-2-24 8-26 9-2 12 10 4 18-3 3-7 6-12 8z" />
            <path d="M53 51c12-3 24 0 25 10 1 9-11 11-18 3-3-3-5-8-7-13z" />
            <path d="M43 51c-9 8-21 12-27 4-5-7 4-16 13-12 4 2 9 5 14 8z" />
            <circle cx="48" cy="48" r="5" fill="currentColor" stroke="none" />
          </g>
        </svg>
        <div>
          <div class="mode" id="mode">–</div>
          <div class="details homey-text-small" id="details"></div>
        </div>
      </div>

      <div class="buttons" id="buttons">
        <button type="button" data-mode="low" data-t="low"></button>
        <button type="button" data-mode="medium" data-t="medium"></button>
        <button type="button" data-mode="high" data-t="high"></button>
        <button type="button" data-mode="auto" data-t="auto"></button>
      </div>
      <div class="message homey-text-small" id="message" role="alert"></div>
    </div>

    <div class="empty homey-text-small" id="empty" hidden></div>
  </body>
</html>
