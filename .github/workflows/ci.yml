name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, test and validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Homey CLI
        run: npm install --global homey

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Validate the app manifest
        run: npm run validate

  publish:
    name: Publish to the Homey App Store
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Only publish when the version changed
        id: version
        run: |
          current=$(jq -r .version .homeycompose/app.json)
          previous=$(git show HEAD^:.homeycompose/app.json | jq -r .version)
          echo "Version $previous -> $current"
          echo "changed=$([ "$current" != "$previous" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish
        id: publish
        if: steps.version.outputs.changed == 'true'
        uses: athombv/github-action-homey-app-publish@master
        with:
          personal_access_token: ${{ secrets.HOMEY_PAT }}

      - name: Link to the build
        if: steps.version.outputs.changed == 'true'
        run: echo "Manage the release at ${{ steps.publish.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
