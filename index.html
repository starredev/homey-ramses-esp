<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RAMSES ESP for Homey</title>
    <script>
      // Dutch browsers go to /nl/, everyone else to /en/. Relative, so it works under any base path.
      var lang = (navigator.language || '').toLowerCase().indexOf('nl') === 0 ? 'nl' : 'en';
      location.replace(lang + '/');
    </script>
    <meta http-equiv="refresh" content="0; url=en/" />
  </head>
  <body>
    <a href="en/">English</a> · <a href="nl/">Nederlands</a>
  </body>
</html>
